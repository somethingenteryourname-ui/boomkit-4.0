# BoomKit settings
# Explosion power controls how big the blast is.
#   Vanilla end crystal  = 6
#   Vanilla respawn anchor = 5
# Players/mobs get hit up to about (power x 2) blocks away.
# You can also change these in-game with /boomradius
crystal-power: 10.0
anchor-power: 10.0

# Shockwave Pickaxe: the biggest radius players can pick in the settings.
# Radius 1 = 3x3, 2 = 5x5, 3 = 7x7, 4 = 9x9, 5 = 11x11 (cube mode: 11x11x11!)
# Max allowed here is 10. Big cubes break a LOT of blocks at once and can lag.
pickaxe-max-radius: 5
